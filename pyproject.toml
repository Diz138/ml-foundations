[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-foundations"
version = "0.1.0"
description = "Experiments in core machine learning foundations."
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Matthew Dzwil" }
]

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "seaborn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ------------------
# Tooling config
# ------------------

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["ml_foundations"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
