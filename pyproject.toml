[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-foundations"
version = "0.1.0"
description = "Experiments in core machine learning foundations."
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "Matthew Dzwil" }
]

dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=1.5,<3.0",
  "scikit-learn>=1.2,<2.0",
  "matplotlib>=3.6,<4.0",
  "seaborn>=0.12,<0.14",
]

  [project.optional-dependencies]
  dev = [
    "pytest>=7.0,<9.0",
    "black>=23.0,<25.0",
    "ruff>=0.3,<0.7",
    "mypy>=1.0,<2.0",
    "pre-commit>=3.0,<4.0",
  ]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ------------------
# Tooling config
# ------------------

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["ml_foundations"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
